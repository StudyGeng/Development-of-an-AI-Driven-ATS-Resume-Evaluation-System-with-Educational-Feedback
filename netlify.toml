[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/home_page.html"
  status = 200

[[headers]]
  for = "/runtime_config.js"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
